name: Publish LNTDV catalog

on:
  push:
    paths:
      - ".github/workflows/import-lntdv.yml"
      - "scripts/patch_lntdv.py"
      - "scripts/fix_photo_loading.py"
      - "catalog/**"
      - "images/**"
      - "assets/**"
      - "order-system.js"
      - "order-system.css"
      - "Code.gs"
  workflow_dispatch:

concurrency:
  group: lntdv-catalog-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate JPG photo assets from source bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          out = Path("images")
          out.mkdir(exist_ok=True)
          for n in range(1, 26):
              src = Path(f"assets/photo{n:02d}.js")
              dst = out / f"natura-{n:02d}.jpg"
              text = src.read_text(encoding="utf-8") if src.exists() else ""
              m = re.search(r'data:image/jpeg;base64,([A-Za-z0-9+/=]+)', text)
              if m:
                  data = base64.b64decode(m.group(1), validate=True)
                  if len(data) < 1000 or not data.startswith(b"\xff\xd8\xff"):
                      raise SystemExit(f"JPG non valido: {src}")
                  dst.write_bytes(data)
              elif dst.exists() and dst.stat().st_size > 1000 and dst.read_bytes().startswith(b"\xff\xd8\xff"):
                  print(f"Sorgente JS assente/vuota per {n:02d}: mantengo il JPG già validato {dst}")
              else:
                  raise SystemExit(f"Immagine sorgente/JPG mancante o non valido: {src} / {dst}")
          print("Generati 25 JPG in images/.")
          PY

      - name: Assemble catalog
        run: |
          rm -f index.html
          for n in $(seq -w 1 14); do cat "catalog/part-$n.html" >> index.html; done
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          if "<html" not in s.lower() or "<body" not in s.lower():
              raise SystemExit("Catalogo non valido")
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          expected={f"{n:03d}" for n in range(1,26)}
          if ids != expected:
              raise SystemExit(f"Catalogo incompleto: presenti {sorted(ids)}, attese {sorted(expected)}")
          print("Catalogo:",len(s),"byte;",len(ids),"codici foto.")
          PY

      - name: Apply site features
        run: python scripts/patch_lntdv.py

      - name: Normalize photo assets and rendering
        run: python scripts/fix_photo_loading.py

      - name: Remove legacy rotation rules from final catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          before=len(re.findall(r'transform\s*:\s*rotate\s*\([^;}]*(?:\);?)',s,re.I))
          s=re.sub(r'transform\s*:\s*rotate\s*\([^;}]*(?:\);?)','transform:none!important;',s,flags=re.I)
          s=re.sub(r'transform-origin\s*:\s*center\s+center\s*!important\s*;','',s,flags=re.I)
          p.write_text(s,encoding="utf-8")
          print(f"Regole rotate rimosse dal catalogo finale: {before}")
          PY

      - name: Externalize generated CSS and preload first photo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          styles=re.findall(r'<style\b[^>]*>([\s\S]*?)</style>',s,re.I)
          css="\n\n".join(styles)+"\n" if styles else ""
          css=re.sub(r'<style\b[^>]*>|</style>',"",css,flags=re.I)
          css=re.sub(r'transform\s*:\s*rotate\s*\([^;}]*(?:\);?)','transform:none!important;',css,flags=re.I)
          css=re.sub(r'transform-origin\s*:\s*center\s+center\s*!important\s*;','',css,flags=re.I)
          if styles:
              Path("assets/css/site-generated.css").write_text(css,encoding="utf-8")
              s=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',"",s,flags=re.I)
          link='<link rel="stylesheet" href="./assets/css/site-generated.css?v=20260919">'
          if link not in s:
              s=s.replace("</head>",link+"\n</head>",1)
          preload='<link rel="preload" as="image" href="./images/natura-01.jpg" fetchpriority="high">'
          if preload not in s:
              s=s.replace("</head>",preload+"\n</head>",1)
          imgs=re.sub(r'(<img\b[^>]*?)\s+loading="eager"',r'\1 loading="lazy"',s,flags=re.I)
          first=re.search(r'<img\b[^>]*\bsrc="(?:\./)?images/natura-01\.jpg"[^>]*>',imgs,re.I)
          if first:
              tag=first.group(0)
              tag=re.sub(r'\sloading="[^"]*"',' loading="eager"',tag,flags=re.I)
              tag=re.sub(r'\sfetchpriority="[^"]*"','',tag,flags=re.I)
              tag=tag[:-1]+' fetchpriority="high">'
              imgs=imgs[:first.start()]+tag+imgs[first.end():]
          p.write_text(imgs,encoding="utf-8")
          print("CSS esterno:",len(css),"byte; HTML:",p.stat().st_size,"byte")
          PY

      - name: Validate HTML, photos, CSS, scripts and order hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path("index.html").read_text(encoding="utf-8")
          css=Path("assets/css/site-generated.css").read_text(encoding="utf-8") if Path("assets/css/site-generated.css").exists() else ""
          combined=s+"\n"+css
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          expected={f"{n:03d}" for n in range(1,26)}
          if ids != expected:
              raise SystemExit(f"Codici foto errati: {sorted(ids)}")
          tags=re.findall(r'<img\b[^>]*>',s,re.I)
          if len([t for t in tags if re.search(r'\balt=["\\\']LNTDV-\d{3}["\\\']',t,re.I)]) < 25:
              raise SystemExit("Meno di 25 immagini catalogo con codice LNTDV.")
          for n in range(1,26):
              p=Path(f"images/natura-{n:02d}.jpg")
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f"Foto mancante o vuota: {p}")
              ok=any(
                  re.search(r'\balt=["\\\']LNTDV-'+f'{n:03d}'+r'["\\\']',t,re.I)
                  and re.search(r'\bsrc=["\\\'](?:\.\/)?images\/natura-'+f'{n:02d}'+r'\.jpg["\\\']',t,re.I)
                  for t in tags
              )
              if not ok:
                  raise SystemExit(f"Collegamento foto non corretto: {n:03d}")
          if "data:image/" in combined:
              raise SystemExit("Sono rimaste immagini Base64 inline nel catalogo/CSS.")
          if re.search(r'transform\s*:\s*rotate\s*\(',combined,re.I):
              raise SystemExit("Trovata rotazione CSS nel catalogo finale o nel CSS generato.")
          if s.count('id="orderPanel"') != 1:
              raise SystemExit("Riepilogo ordine duplicato.")
          if s.count('id="completePayment"') != 1:
              raise SystemExit("Pulsante conferma ordine duplicato.")
          if s.count('id="trackingSection"') != 1:
              raise SystemExit("Sezione tracking duplicata.")
          if "order-system.js" not in s or "order-system.css" not in s:
              raise SystemExit("Motore ordine esterno non collegato.")
          subprocess.run(["node","--check","order-system.js"],check=True)
          print("VALIDAZIONE CATALOGO + CSS + ORDINI OK")
          PY

      - name: Commit and publish
        run: |
          git config user.name "LNTDV Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/css/site-generated.css images/natura-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Rimuovi rotazioni CSS dalla build finale LNTDV"
          git pull --rebase origin main
          git push origin HEAD:main
