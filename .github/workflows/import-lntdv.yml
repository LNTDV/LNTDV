name: Publish LNTDV catalog

on:
  push:
    paths:
      - ".github/workflows/import-lntdv.yml"
      - "scripts/patch_lntdv.py"
      - "scripts/fix_photo_loading.py"
      - "catalog/**"
      - "assets/**"
      - "order-system.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble exact photo catalog
        run: |
          rm -f index.html
          for n in $(seq -w 1 14); do
            cat "catalog/part-$n.html" >> index.html
          done
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          if "<html" not in s.lower() or "<body" not in s.lower():
              raise SystemExit("Catalogo non valido")
          if s.count("<article") < 20 or s.count("<img") < 20:
              raise SystemExit("Il catalogo non contiene tutte le fotografie")
          print("Catalogo assemblato:", len(s), "byte", s.count("<article"), "articoli", s.count("<img"), "immagini")
          PY

      - name: Apply requested features
        run: python scripts/patch_lntdv.py

      - name: Fix photo loading
        run: python scripts/fix_photo_loading.py

      - name: Validate final catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")

          missing_assets=[]
          for n in range(1,26):
              needle=f'./assets/photo{n:02d}.js?v=20260918'
              if needle not in s:
                  missing_assets.append(f"photo{n:02d}.js")
          if missing_assets:
              raise SystemExit("Asset fotografici mancanti nell'index: " + ", ".join(missing_assets))

          preload_pattern=r'<link rel="preload" as="script" href="./assets/photo\d{2}\.js\?v=20260918">'
          preloads=len(re.findall(preload_pattern,s))
          if preloads != 25:
              raise SystemExit(f"Preload fotografici attesi: 25, trovati: {preloads}")

          photo_ids=set(re.findall(r'id="photo-(\d{3})"',s))
          expected={f"{n:03d}" for n in range(1,26)}
          missing_ids=sorted(expected-photo_ids)
          if missing_ids:
              raise SystemExit("Schede fotografiche mancanti: " + ", ".join(missing_ids))
          if len(photo_ids) != 25:
              raise SystemExit(f"Schede fotografiche uniche attese: 25, trovate: {len(photo_ids)}")

          print("Validazione OK: 25 foto, 25 asset, 25 preload e 25 ID fotografici.")
          PY

      - name: Commit and publish
        run: |
          git config user.name "LNTDV Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix catalog validation and publish photo loading"
          git push
