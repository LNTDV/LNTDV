name: Publish LNTDV catalog

on:
  push:
    paths:
      - ".github/workflows/import-lntdv.yml"
      - "scripts/patch_lntdv.py"
      - "scripts/fix_photo_loading.py"
      - "catalog/**"
      - "assets/**"
      - "order-system.js"
  workflow_dispatch:

concurrency:
  group: lntdv-catalog-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble exact photo catalog
        run: |
          rm -f index.html
          for n in $(seq -w 1 14); do
            cat "catalog/part-$n.html" >> index.html
          done
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          if "<html" not in s.lower() or "<body" not in s.lower():
              raise SystemExit("Catalogo non valido")
          import re
          ids = set(re.findall(r'LNTDV-(\d{3})', s))
          expected = {f"{n:03d}" for n in range(1,26)}
          if ids != expected:
              raise SystemExit(f"Catalogo fotografico incompleto: presenti {sorted(ids)}, attese tutte le 25")
          if s.count("<img") < 14:
              raise SystemExit("Struttura immagini del catalogo non valida")
          print("Catalogo assemblato:", len(s), "byte", len(ids), "foto", s.count("<img"), "tag immagine")
          PY

      - name: Apply requested features
        run: python scripts/patch_lntdv.py

      - name: Fix photo loading
        run: python scripts/fix_photo_loading.py

      - name: Validate final catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")

          for n in range(1,26):
              asset=f'./assets/photo{n:02d}.js?v=20260918'
              preload=f'<link rel="preload" as="script" href="./assets/photo{n:02d}.js?v=20260918">'
              if asset not in s:
                  raise SystemExit(f"Asset fotografico mancante nell'index: photo{n:02d}.js")
              if s.count(preload) != 1:
                  raise SystemExit(f"Preload non corretto per photo{n:02d}.js: trovati {s.count(preload)}")

          print("Validazione OK: tutti i 25 asset fotografici e i 25 preload sono presenti una sola volta.")
          PY

      - name: Commit and publish
        run: |
          git config user.name "LNTDV Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix catalog validation and publish photo loading"
          git pull --rebase origin main
          git push origin HEAD:main
