name: LNTDV hourly health check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lntdv-hourly-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog, assets, photo orientation and order system
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          s=Path('index.html').read_text(encoding='utf-8')
          css=Path('assets/css/site-generated.css').read_text(encoding='utf-8')
          js=Path('order-system.js').read_text(encoding='utf-8')
          code=Path('Code.gs').read_text(encoding='utf-8')

          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          expected={f'{n:03d}' for n in range(1,26)}
          assert ids==expected, f'Codici foto errati: {sorted(ids)}'

          assert s.count('id="orderPanel"')==1
          assert s.count('id="completePayment"')==1
          assert s.count('id="trackingSection"')==1
          assert s.count('id="infoMenuButton"')==1
          assert 'order-system.js' in s and 'order-system.css' in s
          assert 'Pannello – Forex' in s
          assert 'Gmail' in js and 'Apple Mail' in js
          assert 'info.lanostraterradavicino@gmail.com' in js
          assert 'function doPost' in code and 'function doGet' in code
          assert 'MailApp.sendEmail' in code
          assert 'trackingToken' in code and 'trackingToken' in js
          assert 'https://script.google.com/macros/s/' in js

          # No CSS rotation is allowed to alter photo orientation.
          assert not re.search(r'transform\s*:\s*rotate\s*\(',s,re.I)
          assert not re.search(r'\.lntdv-photo-stage[^{}]*>\s*img[^{}]*\{[^}]*transform\s*:\s*rotate',css,re.I|re.S)

          # Every local stylesheet/script referenced by index.html must exist.
          for href in re.findall(r"<link[^>]+href=['\"]([^'\"]+\.css)(?:\?[^'\"]*)?['\"]", s, re.I):
              if href.startswith('http'): continue
              assert Path(href.split('?',1)[0].lstrip('./')).exists(), f'CSS mancante: {href}'
          for src in re.findall(r"<script[^>]+src=['\"]([^'\"]+\.js)(?:\?[^'\"]*)?['\"]", s, re.I):
              if src.startswith('http'): continue
              assert Path(src.split('?',1)[0].lstrip('./')).exists(), f'JS mancante: {src}'

          horizontal={1,2,4,5,10,12,17,19,20,21,22,23,24,25}
          vertical={3,6,7,8,9,11,13,14,15,16,18}
          assert horizontal | vertical == set(range(1,26))
          for n in range(1,26):
              p=Path(f'images/natura-{n:02d}.jpg')
              assert p.exists() and p.stat().st_size>1000, f'Foto mancante: {n:02d}'
              assert f'./images/natura-{n:02d}.jpg' in s
              with Image.open(p) as im:
                  w,h=im.size
                  want='H' if n in horizontal else 'V'
                  got='H' if w>h else 'V' if h>w else 'S'
                  assert got==want, f'{p}: expected {want}, got {got} ({w}x{h})'
                  assert im.getexif().get(274,1)==1, f'{p}: EXIF orientation non-normalizzato'

          for n in range(1,26):
              p=Path(f'assets/photo{n:02d}.js')
              assert p.exists(), f'Photo script mancante: {p}'

          assert 'Sitemap: https://lntdv.it/sitemap.xml' in Path('robots.txt').read_text()
          assert 'https://lntdv.it/' in Path('sitemap.xml').read_text()
          PY
          node --check order-system.js

      - name: Check public website
        run: |
          curl -fsSL --max-time 30 -o /tmp/lntdv.html https://lntdv.it/
          grep -q 'LNTDV-001' /tmp/lntdv.html
          grep -q 'LNTDV-025' /tmp/lntdv.html
          grep -q 'La Nostra Terra Da Vicino' /tmp/lntdv.html

      - name: Check Apps Script public deployment
        run: |
          curl -fsSL --max-time 30 'https://script.google.com/macros/s/AKfycbzw1FGh5SVtWTb-20v6acj9IxUvB124dGiELWH-aZ70YuAKbYkaPmwX0ocf64/exec?action=config' -o /tmp/apps.json
          python - <<'PY'
          import json
          raw=open('/tmp/apps.json',encoding='utf-8-sig',errors='replace').read().strip()
          data=json.loads(raw)
          assert isinstance(data,dict) and data.get('ok') is True, raw[:500]
          print('APPS SCRIPT PUBLIC DEPLOYMENT OK')
          PY
