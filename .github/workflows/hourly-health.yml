name: LNTDV hourly health check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: lntdv-hourly-health
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rebuild deterministic catalog
        run: |
          rm -f index.html
          for n in $(seq -w 1 14); do cat "catalog/part-$n.html" >> index.html; done
          python scripts/patch_lntdv.py
          python scripts/fix_photo_loading.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          styles=re.findall(r'<style\b[^>]*>([\s\S]*?)</style>',s,re.I)
          css="\n\n".join(styles)+"\n" if styles else ""
          css=re.sub(r'<style\b[^>]*>|</style>',"",css,flags=re.I)
          Path("assets/css/site-generated.css").write_text(css,encoding="utf-8")
          s=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',"",s,flags=re.I)
          link='<link rel="stylesheet" href="./assets/css/site-generated.css?v=20260919">'
          if link not in s:
              s=s.replace("</head>",link+"\n</head>",1)
          p.write_text(s,encoding="utf-8")
          print("CSS esterno:",len(css),"byte; HTML:",p.stat().st_size,"byte")
          PY

      - name: Apply final LNTDV layout and checkout overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'\\s*<label><input type="radio" name="checkoutPayment" value="Apple Pay"> <span>Apple Pay</span></label>\\s*', '\\n', s)
          s=re.sub(r'\\s*<label><input type="radio" name="checkoutPayment" value="Google Pay"> <span>Google Pay</span></label>\\s*', '\\n', s)
          p.write_text(s,encoding="utf-8")
          css=Path("assets/css/site-generated.css")
          extra=r'''
          /* LNTDV FINAL OVERRIDES */
          body{background:#f4eadf!important}
          main{background:#f4eadf!important;max-width:1500px!important}
          .grid{background:#f4eadf!important;align-items:start!important}
          .card{background:#fff!important}
          .lntdv-photo-stage{width:100%;background:#f4eadf;display:flex;align-items:center;justify-content:center;overflow:hidden}
          .lntdv-photo-stage img{width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;display:block!important;background:#f4eadf!important}
          @media(min-width:1101px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:26px!important}}
          @media(min-width:701px) and (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:22px!important}}
          @media(max-width:700px){.grid{grid-template-columns:1fr!important;gap:18px!important}}
          '''
          css.write_text(css.read_text(encoding="utf-8")+'\n'+extra,encoding="utf-8")
          final=r'''
          /* LNTDV — cornice marrone richiesta */
          .lntdv-photo-stage{background:#fbf6ef!important;border:3px solid #5a3b2b!important;box-sizing:border-box!important;padding:8px!important}
          .lntdv-photo-stage img{background:#fbf6ef!important}
          .meta strong{display:inline-block!important;align-self:flex-end!important;margin-left:auto!important;padding:7px 11px!important;border:1px solid #5a3b2b!important;border-radius:7px!important;background:#fbf6ef!important;color:#5a3b2b!important}
          .meta small{align-self:flex-end!important;text-align:right!important}
          '''
          css.write_text(css.read_text(encoding="utf-8")+'\n'+final,encoding="utf-8")
          print("Override finale applicato.")
          PY

      - name: Validate local catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          expected={f"{n:03d}" for n in range(1,26)}
          assert ids==expected, f"Foto/codici non corretti: {sorted(ids)}"
          assert "data:image/" not in s, "Base64 inline presente"
          assert not re.search(r'transform\s*:\s*rotate\(',s,re.I), "Rotazione CSS presente"
          assert s.count('id="orderPanel"')==1, "orderPanel duplicato"
          assert s.count('id="completePayment"')==1, "completePayment duplicato"
          assert s.count('id="trackingSection"')==1, "trackingSection duplicato"
          for n in range(1,26):
              p=Path(f"images/natura-{n:02d}.jpg")
              assert p.exists() and p.stat().st_size>1000, f"Foto mancante: {p}"
              assert f'./images/natura-{n:02d}.jpg' in s, f"Foto non collegata: {n:02d}"
          print("LOCAL HEALTH OK")
          PY
          node --check order-system.js

      - name: Check public site
        run: |
          curl -fsSL --max-time 30 -o /tmp/lntdv.html https://lntdv.it/
          grep -q 'LNTDV-001' /tmp/lntdv.html
          grep -q 'LNTDV-025' /tmp/lntdv.html
          echo "PUBLIC SITE OK"

      - name: Check Apps Script endpoint
        run: |
          set +e
          curl -fsSL --max-time 30 'https://script.google.com/macros/s/AKfycbwYI8raiMQ830nMMtRm3FQueXv2a9vbrdH3SJkg7csqGEdnd1vIKS1Y1-jwjJvCPBA/exec?action=config' -o /tmp/apps.json
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/apps.json').read_text(encoding='utf-8-sig', errors='replace').strip()
          try:
              data=json.loads(raw)
          except Exception:
              data=None
          if isinstance(data, dict) and data.get('ok') is True:
              print("APPS SCRIPT CONFIG OK")
          else:
              print("AVVISO: endpoint config raggiunto ma non restituisce JSON valido.")
              print(raw[:500])
              print("Il controllo del sito non viene bloccato da questo warning.")
          PY

      - name: Publish automatic repair if needed
        run: |
          git config user.name "LNTDV Health Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/css/site-generated.css
          if git diff --cached --quiet; then
            echo "Nessuna correzione necessaria."
            exit 0
          fi
          git commit -m "Auto-ripristino catalogo LNTDV"
          git push origin HEAD:main
