# LNTDV GitHub Pages deployment — static build
# Triggered refresh: 2026-09-20 — final republish
name: Deploy LNTDV catalog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize canonical index HTML header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove literal backslash-n artifacts that were being rendered at the top of the page.
          s=s.replace('\\n','\n')
          header='''<header class="lntdv-brown-title-only">
          <button id="infoMenuButton" class="info-menu-button" type="button" aria-label="Apri menu" aria-expanded="false"><span></span><span></span><span></span></button>
          <div class="lntdv-project-heading">La Nostra Terra Da Vicino</div>
          <div class="lntdv-project-description">
            <p>Il progetto nasce dall’osservazione del territorio, della natura e dei luoghi che attraversiamo, per raccontare attraverso la fotografia il rapporto tra ambiente, tempo e presenza umana.</p>
            <p>“La Nostra Terra Da Vicino” significa avvicinare lo sguardo a ciò che spesso abbiamo davanti agli occhi senza fermarci a osservarlo: la terra, i suoi dettagli, i cambiamenti del paesaggio e il nostro modo di viverlo.</p>
          </div>
          <div class="lntdv-story-qr">
            <img src="./assets/qr/lntdv-story-qr.svg?v=20260925-index-final" alt="QR code — Segui la storia della mostra">
            <div class="lntdv-story-qr-label">Segui la storia della mostra</div>
          </div>
          <div class="lntdv-exhibition-title">MOSTRA FOTOGRAFICA DI EDVINAS DRAGONI</div>
        </header><main>'''
          s2=re.sub(r'<header\b[\s\S]*?</header>\s*<main>',header,s,count=1)
          if s2==s:
              raise SystemExit('Header HTML non trovato: nessuna modifica eseguita.')
          s=s2
          css='''\n<style id="lntdv-index-header-canonical">\n.lntdv-brown-title-only{position:relative;background:#6b4938!important;color:#fffaf3!important;text-align:center!important;padding:58px 16px 30px!important;box-sizing:border-box!important}\n.lntdv-brown-title-only .lntdv-project-heading{margin:0 auto!important;font:700 clamp(34px,7vw,56px)/1.08 Georgia,serif!important;max-width:900px!important}\n.lntdv-brown-title-only .info-menu-button{position:absolute!important;top:14px!important;right:16px!important;left:auto!important;z-index:20!important;width:34px!important;height:30px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:center!important;gap:5px!important;padding:0!important;margin:0!important;background:transparent!important;border:0!important}\n.lntdv-brown-title-only .info-menu-button span{display:block!important;width:24px!important;height:2px!important;background:#fffaf3!important}\n.lntdv-project-description{width:min(820px,100%);margin:18px auto 0;color:#f7eee5;font:400 14px/1.6 Georgia,serif;text-align:center}\n.lntdv-project-description p{margin:0 auto 10px}\n.lntdv-story-qr{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;margin:22px auto 0}\n.lntdv-story-qr img{display:block;width:136px;height:136px;object-fit:contain;background:#fff;border:4px solid #fff;border-radius:4px;box-sizing:border-box}\n.lntdv-story-qr-label{margin-top:7px;color:#fffaf3;font:700 12px/1.3 Arial,sans-serif;letter-spacing:.5px}\n.lntdv-exhibition-title{margin:18px auto 0;color:#fffaf3;font:800 12px/1.3 Arial,sans-serif;letter-spacing:1.2px;text-transform:uppercase}\n@media(max-width:600px){.lntdv-brown-title-only{padding:52px 12px 25px!important}.lntdv-brown-title-only .info-menu-button{top:12px!important;right:14px!important}.lntdv-project-description{font-size:13px;line-height:1.55}.lntdv-story-qr img{width:136px;height:136px}.lntdv-exhibition-title{font-size:11px;letter-spacing:1px}}\n</style>\n'''
          if 'id="lntdv-index-header-canonical"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix canonical index HTML header order"
            git push origin HEAD:main
          else
            echo "Canonical index header already applied."
          fi

      - name: Validate published static catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          expected={f"{n:03d}" for n in range(1,26)}
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          if ids != expected:
              raise SystemExit(f"Codici foto errati: {sorted(ids)}")
          for n in range(1,26):
              p=Path(f"images/natura-{n:02d}.jpg")
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f"Foto mancante o vuota: {p}")
          if not Path("assets/css/site-generated.css").exists():
              raise SystemExit("CSS generato mancante: assets/css/site-generated.css")
          if "data:image/" in s:
              raise SystemExit("Base64 inline presente nell'HTML pubblicato.")
          if s.count('id="orderPanel"') != 1:
              raise SystemExit("orderPanel duplicato.")
          if s.count('id="completePayment"') != 1:
              raise SystemExit("completePayment duplicato.")
          if s.count('id="trackingSection"') != 1:
              raise SystemExit("trackingSection duplicato.")
          print("STATIC CATALOG OK:", len(s), "bytes")
          PY

      - name: Restore original source photos and apply only requested rotations
        run: |
          if [ -f .lntdv-photo-orientation-v5 ]; then
            echo "SOURCE PHOTO ORIENTATION V5 ALREADY APPLIED"
            exit 0
          fi

          python -m pip install --quiet pillow
          SOURCE_ORIGINALS_COMMIT="faa81fde313183e0a01db96f32e6e3a6dbf8224f"
          TMP_DIR="$(mktemp -d)"
          for n in $(seq -w 1 25); do
            git show "$SOURCE_ORIGINALS_COMMIT:images/natura-$n.jpg" > "$TMP_DIR/natura-$n.jpg"
          done
          TMP_DIR="$TMP_DIR" python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os
          tmp=Path(os.environ["TMP_DIR"]); dst=Path("images")
          rotate_clockwise={6,7,18}; rotate_180={8,9,11,15}
          for n in range(1,26):
              src=tmp/f"natura-{n:02d}.jpg"; out=dst/f"natura-{n:02d}.jpg"
              if n not in rotate_clockwise and n not in rotate_180:
                  out.write_bytes(src.read_bytes()); continue
              with Image.open(src) as original:
                  im=ImageOps.exif_transpose(original).convert("RGB")
                  im=im.transpose(Image.Transpose.ROTATE_270 if n in rotate_clockwise else Image.Transpose.ROTATE_180)
                  exif=im.getexif(); exif[274]=1
                  im.save(out,format="JPEG",quality=95,optimize=True,exif=exif.tobytes())
          print("SOURCE PHOTOS RESTORED: only requested rotations applied")
          PY
          rm -f .lntdv-photo-orientation-v3 .lntdv-photo-orientation-v4
          printf '%s\n' "Original source bytes restored from pre-normalization commit; ONLY 006,007,018 clockwise and 008,009,011,015 180 degrees applied." > .lntdv-photo-orientation-v5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original photo orientations exactly"
          git push origin HEAD:main

      - name: Prepare static Pages artifact
        run: |
          touch .nojekyll
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='catalog' --exclude='scripts' --exclude='Code.gs' --exclude='inoltro.gs' --exclude='README.md' --exclude='RESTORE_NOTICE.txt' --exclude='assets/photo*.js' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); s=p.read_text(encoding='utf-8')
          replacements={
              '<meta name="apple-mobile-web-app-title" content="lntdv">':'<meta name="apple-mobile-web-app-title" content="LNTDV">',
              '<meta name="application-name" content="lntdv – La Nostra Terra Da Vicino">':'<meta name="application-name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:site_name" content="lntdv – La Nostra Terra Da Vicino">':'<meta property="og:site_name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:description" content="Progetto fotografico lntdv – La Nostra Terra Da Vicino.">':'<meta property="og:description" content="Progetto fotografico LNTDV – La Nostra Terra Da Vicino.">'}
          for old,new in replacements.items(): s=s.replace(old,new)
          required=['<title>Mostra fotografica Edvinas Dragoni | La Nostra Terra Da Vicino | LNTDV</title>','<meta name="application-name" content="LNTDV">','<meta property="og:site_name" content="LNTDV">','"alternateName"','"LNTDV"','"La Nostra Terra Da Vicino"','"Mostra fotografica Edvinas Dragoni"','Edvinas Dragoni']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit("Segnali SEO LNTDV mancanti nell'artefatto: "+repr(missing))
          p.write_text(s,encoding='utf-8')
          print("SEO ENTITY SIGNALS OK: LNTDV")
          PY
          echo "Static Pages artifact pronto."

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
