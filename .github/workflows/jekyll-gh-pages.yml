# LNTDV GitHub Pages deployment — static build
# Triggered refresh: 2026-09-20 — final republish
name: Deploy LNTDV catalog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate published static catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          expected={f"{n:03d}" for n in range(1,26)}
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          if ids != expected:
              raise SystemExit(f"Codici foto errati: {sorted(ids)}")
          for n in range(1,26):
              p=Path(f"images/natura-{n:02d}.jpg")
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f"Foto mancante o vuota: {p}")
          if not Path("assets/css/site-generated.css").exists():
              raise SystemExit("CSS generato mancante: assets/css/site-generated.css")
          if "data:image/" in s:
              raise SystemExit("Base64 inline presente nell'HTML pubblicato.")
          if s.count('id="orderPanel"') != 1:
              raise SystemExit("orderPanel duplicato.")
          if s.count('id="completePayment"') != 1:
              raise SystemExit("completePayment duplicato.")
          if s.count('id="trackingSection"') != 1:
              raise SystemExit("trackingSection duplicato.")
          print("STATIC CATALOG OK:", len(s), "bytes")
          PY

      - name: Restore original source photos and apply only requested rotations
        run: |
          if [ -f .lntdv-photo-orientation-v5 ]; then
            echo "SOURCE PHOTO ORIENTATION V5 ALREADY APPLIED"
            exit 0
          fi

          python -m pip install --quiet pillow

          # The first generic orientation workflow physically changed the JPEGs.
          # Restore the exact pre-normalization source bytes first, then apply
          # ONLY the rotations explicitly requested for 006,007,008,009,011,015,018.
          SOURCE_ORIGINALS_COMMIT="faa81fde313183e0a01db96f32e6e3a6dbf8224f"
          TMP_DIR="$(mktemp -d)"

          for n in $(seq -w 1 25); do
            git show "$SOURCE_ORIGINALS_COMMIT:images/natura-$n.jpg" > "$TMP_DIR/natura-$n.jpg"
          done

          TMP_DIR="$TMP_DIR" python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os

          tmp = Path(os.environ["TMP_DIR"])
          dst = Path("images")

          rotate_clockwise = {6, 7, 18}
          rotate_180 = {8, 9, 11, 15}

          for n in range(1, 26):
              src = tmp / f"natura-{n:02d}.jpg"
              out = dst / f"natura-{n:02d}.jpg"

              if n not in rotate_clockwise and n not in rotate_180:
                  out.write_bytes(src.read_bytes())
                  continue

              with Image.open(src) as original:
                  im = ImageOps.exif_transpose(original).convert("RGB")
                  if n in rotate_clockwise:
                      im = im.transpose(Image.Transpose.ROTATE_270)
                  else:
                      im = im.transpose(Image.Transpose.ROTATE_180)
                  exif = im.getexif()
                  exif[274] = 1
                  im.save(out, format="JPEG", quality=95, optimize=True, exif=exif.tobytes())

          print("SOURCE PHOTOS RESTORED: only requested rotations applied")
          PY

          rm -f .lntdv-photo-orientation-v3 .lntdv-photo-orientation-v4
          printf '%s\n' "Original source bytes restored from pre-normalization commit; ONLY 006,007,018 clockwise and 008,009,011,015 180 degrees applied." > .lntdv-photo-orientation-v5

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original photo orientations exactly"
          git push origin HEAD:main

      - name: Prepare static Pages artifact
        run: |
          touch .nojekyll
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='catalog' \
            --exclude='scripts' \
            --exclude='Code.gs' \
            --exclude='inoltro.gs' \
            --exclude='README.md' \
            --exclude='RESTORE_NOTICE.txt' \
            --exclude='assets/photo*.js' \
            ./ _site/

          python - <<'PY'

          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")

          # Normalize only legacy metadata when it is present. The current index.html
          # already contains the canonical LNTDV metadata, so do not require an obsolete title format.
          replacements = {
              '<meta name="apple-mobile-web-app-title" content="lntdv">':
                  '<meta name="apple-mobile-web-app-title" content="LNTDV">',
              '<meta name="application-name" content="lntdv – La Nostra Terra Da Vicino">':
                  '<meta name="application-name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:site_name" content="lntdv – La Nostra Terra Da Vicino">':
                  '<meta property="og:site_name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:description" content="Progetto fotografico lntdv – La Nostra Terra Da Vicino.">':
                  '<meta property="og:description" content="Progetto fotografico LNTDV – La Nostra Terra Da Vicino.">',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # The live source currently uses the official title/description format below.
          # Keep the check aligned with the source instead of an obsolete historical format.
          required = [
              '<title>LNTDV | Sito ufficiale — La Nostra Terra Da Vicino | Edvinas Dragoni</title>',
              '<meta name="application-name" content="LNTDV">',
              '<meta property="og:site_name" content="LNTDV">',
              '"alternateName":["LNTDV","La Nostra Terra Da Vicino","LNTDV — La Nostra Terra Da Vicino"]',
              'Edvinas Dragoni',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Segnali SEO LNTDV mancanti nell'artefatto: " + repr(missing))

          p.write_text(s, encoding="utf-8")
          print("SEO ENTITY SIGNALS OK: LNTDV")
          PY

          echo "Static Pages artifact pronto."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
