# LNTDV GitHub Pages deployment
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble published catalog
        run: |
          rm -f index.html
          for n in $(seq -w 1 14); do
            cat "catalog/part-$n.html" >> index.html
          done
          python scripts/patch_lntdv.py
          python scripts/fix_photo_loading.py
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for n in range(1,26):
              asset=f'./assets/photo{n:02d}.js?v=20260918'
              preload=f'<link rel="preload" as="script" href="./assets/photo{n:02d}.js?v=20260918">'
              if asset not in s:
                  raise SystemExit(f"Asset fotografico mancante: photo{n:02d}.js")
              if s.count(preload) != 1:
                  raise SystemExit(f"Preload non corretto: photo{n:02d}.js")
          print("Pages build: catalogo assemblato con 25 asset e 25 preload.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
