# LNTDV GitHub Pages deployment — static build
# Triggered refresh: 2026-09-19
name: Deploy LNTDV catalog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate published static catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          expected={f"{n:03d}" for n in range(1,26)}
          ids=set(re.findall(r'LNTDV-(\d{3})',s))
          if ids != expected:
              raise SystemExit(f"Codici foto errati: {sorted(ids)}")
          for n in range(1,26):
              p=Path(f"images/natura-{n:02d}.jpg")
              if not p.exists() or p.stat().st_size < 1000:
                  raise SystemExit(f"Foto mancante o vuota: {p}")
          if not Path("assets/css/site-generated.css").exists():
              raise SystemExit("CSS generato mancante: assets/css/site-generated.css")
          if "data:image/" in s:
              raise SystemExit("Base64 inline presente nell'HTML pubblicato.")
          if s.count('id="orderPanel"') != 1:
              raise SystemExit("orderPanel duplicato.")
          if s.count('id="completePayment"') != 1:
              raise SystemExit("completePayment duplicato.")
          if s.count('id="trackingSection"') != 1:
              raise SystemExit("trackingSection duplicato.")
          print("STATIC CATALOG OK:", len(s), "bytes")
          PY

      - name: Prepare static Pages artifact
        run: |
          touch .nojekyll
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='catalog' \
            --exclude='scripts' \
            --exclude='Code.gs' \
            --exclude='inoltro.gs' \
            --exclude='README.md' \
            --exclude='RESTORE_NOTICE.txt' \
            --exclude='assets/photo*.js' \
            ./ _site/

          # FINAL PHOTO ORIENTATION — DO NOT GENERICALLY ROTATE THE CATALOG.
          # Apply only the exact corrections requested for the LNTDV sequence:
          # 006, 007, 018 = 90° CLOCKWISE
          # 008, 009, 011, 015 = 180°
          # All other photographs keep their source orientation.
          # EXIF is reset after the physical pixel rotation so every browser
          # receives the same visible orientation.
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          # Applica ESCLUSIVAMENTE le rotazioni indicate dall'autore.
          # Nessuna inferenza basata su verticale/orizzontale viene applicata
          # alle altre fotografie.
          # 006, 007, 018 = 90° ORARIO
          # 008, 009, 011, 015 = 180°
          rotate_clockwise={6,7,18}
          rotate_180={8,9,11,15}

          for n in range(1,26):
              p=Path(f"_site/images/natura-{n:02d}.jpg")
              with Image.open(p) as src:
                  im=ImageOps.exif_transpose(src).convert("RGB")
                  original_size=im.size

                  if n in rotate_clockwise:
                      im=im.transpose(Image.Transpose.ROTATE_270)
                  elif n in rotate_180:
                      im=im.transpose(Image.Transpose.ROTATE_180)

                  im.save(p,format="JPEG",quality=95,optimize=True)
                  if n in rotate_clockwise and im.size == original_size:
                      raise SystemExit(f"Rotazione 90° non applicata: {p}")
          print("PUBLISHED PHOTO ORIENTATION OK")
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text(encoding="utf-8")

          replacements = {
              '<meta name="apple-mobile-web-app-title" content="lntdv">':
                  '<meta name="apple-mobile-web-app-title" content="LNTDV">',
              '<title>lntdv – La Nostra Terra Da Vicino | Edvinas Dragoni</title>':
                  '<title>LNTDV – La Nostra Terra Da Vicino | Edvinas Dragoni</title>',
              '<meta name="application-name" content="lntdv – La Nostra Terra Da Vicino">':
                  '<meta name="application-name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:site_name" content="lntdv – La Nostra Terra Da Vicino">':
                  '<meta property="og:site_name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:description" content="Progetto fotografico lntdv – La Nostra Terra Da Vicino.">':
                  '<meta property="og:description" content="Progetto fotografico LNTDV – La Nostra Terra Da Vicino.">',
              '"name":"lntdv – La Nostra Terra Da Vicino","alternateName":"lntdv"':
                  '"name":"LNTDV – La Nostra Terra Da Vicino","alternateName":"LNTDV","identifier":"LNTDV"',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          marker = '<meta name="description" content="LNTDV – La Nostra Terra Da Vicino: progetto fotografico di Edvinas Dragoni, un viaggio tra Natura, Tempo e Città.">'
          if marker in s and '<meta name="keywords" content="LNTDV, La Nostra Terra Da Vicino, Edvinas Dragoni">' not in s:
              s = s.replace(marker, marker + '\n<meta name="keywords" content="LNTDV, La Nostra Terra Da Vicino, Edvinas Dragoni">')

          required = [
              '<title>LNTDV – La Nostra Terra Da Vicino | Edvinas Dragoni</title>',
              '<meta name="application-name" content="LNTDV – La Nostra Terra Da Vicino">',
              '<meta property="og:site_name" content="LNTDV – La Nostra Terra Da Vicino">',
              '"alternateName":"LNTDV"',
              '"identifier":"LNTDV"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Segnali SEO LNTDV mancanti nell'artefatto: " + repr(missing))

          p.write_text(s, encoding="utf-8")
          print("SEO ENTITY SIGNALS OK: LNTDV")
          PY

          echo "Static Pages artifact pronto."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
