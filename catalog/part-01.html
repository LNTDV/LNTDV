<style>:root{--brown:#4b2f22;--brown2:#6b4734;--cream:#f4eadf;--paper:#fbf8f3;--line:#d8c6b4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--brown);font-family:Georgia,serif}header{background:var(--brown);color:#f4eadf;padding:55px 20px 42px;text-align:center}.brand{font:800 15px Arial;letter-spacing:3px}h1{font-size:clamp(38px,7vw,72px);font-weight:400;margin:14px 0}.intro{max-width:760px;margin:auto;line-height:1.6;color:#eadbd0}.legend{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:20px}.legend span{border:1px solid #bda897;border-radius:999px;padding:7px 11px;font:10px Arial;letter-spacing:1px}main{max-width:1250px;margin:auto;padding:30px 18px 60px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(75,47,34,.08)}

.order-panel{position:fixed;inset:auto 18px 18px auto;width:min(440px,calc(100vw - 36px));max-height:85vh;overflow:auto;background:#fff;border:1px solid #d8c6b4;border-radius:18px;box-shadow:0 18px 50px rgba(75,47,34,.22);padding:20px;z-index:50;display:none}

<style id="catalog-animations">
/* Animazioni raffinate e leggere */
@keyframes fadeUpPro{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes softScale{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
@keyframes selectedPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(84,116,90,.18)}
  50%{box-shadow:0 0 0 7px rgba(84,116,90,0)}
}
@keyframes checkPop{
  0%{opacity:0;transform:scale(.55)}
  70%{transform:scale(1.15)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes barIn{
  from{opacity:0;transform:translate(-50%,130px)}
  to{opacity:1;transform:translate(-50%,0)}
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(28px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes rowIn{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}
}

/* Entrata progressiva delle sezioni */
section{
  animation:fadeUpPro .8s ease both;
  animation-timeline:view();
  animation-range:entry 0% cover 18%;
}

/* Fotografie: comparsa morbida e hover */
.card,.photo-card{
  animation:softScale .7s ease both;
  animation-timeline:view();
  animation-range:entry 0% cover 16%;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease,border-color .35s ease;
}
.card:hover,.photo-card:hover{
  transform:translateY(-7px);
  box-shadow:0 24px 55px rgba(47,33,26,.18);
}
.card img,.photo-card img{
  transition:transform .8s cubic-bezier(.2,.8,.2,1),filter .5s ease;
}
.card:hover img,.photo-card:hover img{transform:scale(1.025);filter:none!important}

/* Selezione foto: feedback immediato */
.card.selected,.photo-card.selected{
  border-color:#54745a!important;
  box-shadow:0 0 0 2px rgba(84,116,90,.35),0 20px 55px rgba(47,33,26,.14);
  animation:selectedPulse 1.8s ease-in-out infinite;
}

/* Barra ordine */
.order-bar.active{animation:barIn .55s cubic-bezier(.2,.8,.2,1) both}
.order-button{transition:transform .25s ease,background .25s ease,box-shadow .25s ease}
.order-button:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(0,0,0,.18)}
.order-button:active{transform:translateY(0) scale(.98)}

/* Popup */
.modal.active .modal-content{animation:modalIn .45s cubic-bezier(.2,.8,.2,1) both}

/* Righe del riepilogo */
.checkout-photo-row{animation:rowIn .35s ease both}
.checkout-photo-row:nth-child(2){animation-delay:.03s}
.checkout-photo-row:nth-child(3){animation-delay:.06s}
.checkout-photo-row:nth-child(4){animation-delay:.09s}
.checkout-photo-row:nth-child(5){animation-delay:.12s}
.checkout-photo-row:nth-child(6){animation-delay:.15s}
.checkout-photo-row:nth-child(7){animation-delay:.18s}
.checkout-photo-row:nth-child(8){animation-delay:.21s}
.checkout-photo-row:nth-child(9){animation-delay:.24s}
.checkout-photo-row:nth-child(10){animation-delay:.27s}

/* Pulsante conferma */
.checkout-submit{transition:transform .25s ease,filter .25s ease,box-shadow .25s ease}
.checkout-submit:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 8px 22px rgba(84,116,90,.25)}
.checkout-submit:not(:disabled):active{transform:scale(.98)}

/* Campi cliente e pagamenti */
.checkout-fields input,.checkout-fields textarea,.payment-choice label{
  transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease,background .25s ease;
}
.checkout-fields input:focus,.checkout-fields textarea:focus{
  border-color:#765848;
  box-shadow:0 0 0 3px rgba(118,88,72,.10);
  transform:translateY(-1px);
}
.payment-choice label:hover{transform:translateX(3px);border-color:#765848}
.payment-choice label:has(input:checked){
  box-shadow:0 0 0 2px rgba(84,116,90,.13);
}

/* Riduce le animazioni per chi le disabilita a livello sistema */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>

<style id="photo-clarity-fix">
/* Fotografie senza patina/velo bianco */
.card img,.photo-card img,.photo-image img{
  opacity:1!important;
  filter:none!important;
  mix-blend-mode:normal!important;
  background:transparent!important;
}
.card::before,.card::after,
.photo-card::before,.photo-card::after,
.photo-image::before,.photo-image::after{

<style id="lntdv-final-functions-style">
:root{--lntdv-green:#6f8f72;--lntdv-green-dark:#4f6d54;--lntdv-beige:#efe4d0;--lntdv-maroon:#542d2b;--lntdv-brown:#2f211a}
.order-bar{z-index:9999!important;left:auto!important;right:18px!important;bottom:18px!important;max-width:min(520px,calc(100vw - 36px));border:1px solid rgba(84,45,43,.25)!important;box-shadow:0 18px 45px rgba(47,33,26,.24)!important;animation:lntdvFloat .55s ease both}
.order-button,.checkout-complete,.tracking-submit{transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.order-button:hover,.checkout-complete:hover:not(:disabled),.tracking-submit:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(79,109,84,.25)}
.card.selected{outline:3px solid var(--lntdv-green)!important;outline-offset:3px;box-shadow:0 0 0 8px rgba(111,143,114,.14)!important}
.card.selected:after{content:"✓ SELEZIONATA";position:absolute;top:12px;right:12px;background:var(--lntdv-green);color:#fff;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;z-index:5;animation:lntdvPop .25s ease both}
.delivery-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.delivery-choice label,.payment-choice label{display:flex;align-items:center;gap:9px;padding:12px 13px;border:1px solid rgba(84,45,43,.18);border-radius:12px;background:#fffaf2;cursor:pointer;transition:.2s}
.delivery-choice label:has(input:checked),.payment-choice label:has(input:checked){border-color:var(--lntdv-green);background:rgba(111,143,114,.10);box-shadow:0 0 0 2px rgba(111,143,114,.10)}
.delivery-note{margin-top:8px;font-size:12px;opacity:.72}
.tracking-section{margin:70px auto 130px;max-width:1100px;padding:34px;background:linear-gradient(145deg,#f5ead7,#eadbc4);border:1px solid rgba(84,45,43,.18);border-radius:24px;box-shadow:0 18px 55px rgba(47,33,26,.12)}
.tracking-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}
.tracking-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--lntdv-maroon);font-weight:800}
.tracking-title{margin:5px 0 0;color:var(--lntdv-brown)}
.tracking-form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}
.tracking-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid rgba(84,45,43,.2);border-radius:12px;background:#fffdf8;color:var(--lntdv-brown)}
.tracking-submit{border:0;border-radius:12px;padding:14px 18px;background:var(--lntdv-maroon);color:#fff;font-weight:800;cursor:pointer}
.tracking-message{margin-top:15px;min-height:20px}
.tracking-result{margin-top:25px;display:none}
.tracking-order-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.tracking-chip{padding:8px 11px;border-radius:999px;background:#fffdf8;border:1px solid rgba(84,45,43,.15);font-size:12px}
.tracking-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tracking-step{position:relative;padding:18px 12px;border-top:4px solid #cbbda8;color:#7d6b5f;transition:.3s}
.tracking-step.done,.tracking-step.active{border-color:var(--lntdv-green);color:var(--lntdv-green-dark);background:rgba(111,143,114,.08);border-radius:12px}
.tracking-step.done .step-dot,.tracking-step.active .step-dot{background:var(--lntdv-green);color:#fff}
.step-dot{width:28px;height:28px;border-radius:50%;background:#cbbda8;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;margin-bottom:9px}
.step-name{font-weight:800;font-size:12px;letter-spacing:.06em}
.step-date{font-size:11px;margin-top:5px;opacity:.72}
@keyframes lntdvPop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes lntdvFloat{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:760px){.order-bar{left:auto!important;right:10px!important;bottom:10px!important;max-width:calc(100vw - 20px);width:calc(100vw - 20px)}.tracking-form{grid-template-columns:1fr}.tracking-steps{grid-template-columns:1fr 1fr}.delivery-choice{grid-template-columns:1fr}.tracking-section{margin:45px 12px 120px;padding:22px}}
</style>
