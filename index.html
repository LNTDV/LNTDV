<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La nostra terra da vicino — Edvinas Dragoni</title><style>body{margin:0;background:#f4eadf;color:#2f211a;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center}#loading strong{font-size:22px}#loading span{display:block;margin-top:8px;opacity:.65}</style></head><body><div id="loading"><div><strong>La nostra terra da vicino</strong><span>Caricamento del catalogo…</span></div></div><script>(async()=>{try{const p=["catalog/part-01.html","catalog/part-02.html","catalog/part-03.html","catalog/part-04.html","catalog/part-05.html","catalog/part-06.html","catalog/part-07.html","catalog/part-08.html","catalog/part-09.html","catalog/part-10.html","catalog/part-11.html","catalog/part-12.html","catalog/part-13.html","catalog/part-14.html"];const t=await Promise.all(p.map(x=>fetch(x,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(x);return r.text()})));document.open();document.write(t.join(""));document.close()}catch(e){document.getElementById("loading").innerHTML="<strong>Impossibile caricare il catalogo.</strong><span>Ricarica la pagina tra qualche secondo.</span>"}})();</script></body></html>
