<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a3b2b">
<meta name="description" content="La Nostra Terra da Vicino — Catalogo fotografico Edvinas Dragoni, Arese 2026.">
<title>Catalogo fotografico Arese 2026 — Edvinas Dragoni</title>
<style>
:root{--brown:#5a3b2b;--dark:#33231b;--beige:#f3eadc;--paper:#fffaf3;--line:#d8c5ae;--soft:#eee0ce}
*{box-sizing:border-box}html,body{margin:0;background:var(--beige);color:var(--dark);font-family:Georgia,'Times New Roman',serif}body{min-height:100vh}.wrap{max-width:1400px;margin:auto;padding:22px clamp(14px,3vw,42px) 70px}.top{display:flex;align-items:flex-start;gap:18px;padding:12px 0 24px;border-bottom:1px solid var(--line)}.logo{width:62px;height:62px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--brown);font-weight:700;letter-spacing:.08em}.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#755f50}.title{margin:4px 0 5px;color:var(--brown);font-size:clamp(1.8rem,4vw,3.1rem);line-height:1.02}.subtitle{margin:0;color:#755f50}.intro{max-width:780px;line-height:1.55;margin:24px 0}.section{margin-top:42px}.section h2{margin:0;color:var(--brown);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase}.section p{margin:6px 0 18px;color:#755f50}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 7px 24px rgba(63,40,30,.08)}.photo{background:#e8d7c1;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.meta{padding:13px 14px 15px}.name{font-weight:700;color:var(--brown);line-height:1.25}.orientation{display:inline-block;margin-top:7px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#755f50;background:var(--soft);border-radius:999px;padding:5px 8px}.empty{padding:40px;background:var(--paper);border:1px solid var(--line);border-radius:14px}.loading{min-height:55vh;display:grid;place-items:center;color:var(--brown);font-weight:700}.foot{margin-top:55px;padding-top:18px;border-top:1px solid var(--line);font-size:.9rem;color:#755f50}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">Sto preparando il nuovo catalogo…</div></div>
<script>
const SOURCE='https://raw.githubusercontent.com/LNTDV/LNTDV/f963575cf7185f8d3bd59d1e83c33963ee29af45/index_final_github.html';
const groups=[['Natura','10 fotografie'],['Tempo','3 fotografie'],['Natura vs Città','12 fotografie']];
function cleanText(s){return (s||'').replace(/\s+/g,' ').trim()}
function orientation(img){const w=img.naturalWidth||img.width||0,h=img.naturalHeight||img.height||0;return w>h?'Orizzontale':'Verticale'}
function build(images){
 const app=document.getElementById('app');
 app.innerHTML=`<header class="top"><div class="logo">ED</div><div><div class="eyebrow">La Nostra Terra da Vicino</div><h1 class="title">Catalogo fotografico Arese 2026</h1><p class="subtitle">Edvinas Dragoni · 25 fotografie</p></div></header><p class="intro">Una selezione fotografica dedicata al rapporto tra paesaggio, tempo e trasformazione. Guarda le immagini, scopri l'orientamento di ogni stampa e scegli le fotografie da portare con te.</p><main id="sections"></main><footer class="foot">Edvinas Dragoni · La Nostra Terra da Vicino</footer>`;
 const sections=document.getElementById('sections'); let pos=0;
 groups.forEach(([title,count])=>{const n=Number(count.split(' ')[0]);const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<h2>${title}</h2><p>${count}</p><div class="grid"></div>`;const grid=sec.querySelector('.grid');images.slice(pos,pos+n).forEach((src,i)=>{const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=src;img.alt=`${title} — fotografia ${i+1}`;img.loading='lazy';photo.appendChild(img);const meta=document.createElement('div');meta.className='meta';const name=document.createElement('div');name.className='name';name.textContent=`${title} · ${String(i+1).padStart(2,'0')}`;const badge=document.createElement('span');badge.className='orientation';badge.textContent='Orientamento verticale';img.addEventListener('load',()=>{badge.textContent='Orientamento '+orientation(img)});meta.append(name,badge);card.append(photo,meta);grid.appendChild(card)});sections.appendChild(sec);pos+=n});
}
fetch(SOURCE).then(r=>{if(!r.ok)throw new Error('source');return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const seen=new Set();const imgs=[...doc.querySelectorAll('img')].map(x=>x.getAttribute('src')).filter(x=>x&&!seen.has(x)&&seen.add(x)).slice(0,25);if(imgs.length<25)throw new Error('photos');build(imgs)}).catch(()=>{document.getElementById('app').innerHTML='<div class="empty"><h2>Catalogo temporaneamente non disponibile</h2><p>Riprova tra qualche secondo.</p></div>'});
</script>
</body>
</html>
