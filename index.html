<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a3b2b">
<meta name="description" content="La Nostra Terra da Vicino — Catalogo fotografico di Edvinas Dragoni, Arese 2026.">
<title>Catalogo fotografico Arese 2026 — Edvinas Dragoni</title>
<style>
:root{--brown:#5a3b2b;--dark:#3d281d;--beige:#f3eadc;--paper:#fffaf3;--line:#d8c5ae}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--beige)}body{font-family:Georgia,'Times New Roman',serif;color:var(--dark)}
#catalog{width:100%;height:100vh;height:100dvh;border:0;display:block;background:var(--beige)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--beige);color:var(--brown);font-weight:700;z-index:10}
</style>
</head>
<body>
<div id="loading">Sto preparando il catalogo fotografico…</div>
<iframe id="catalog" title="La Nostra Terra da Vicino — Catalogo fotografico"></iframe>
<script>
const OLD='https://raw.githubusercontent.com/LNTDV/LNTDV/f963575cf7185f8d3bd59d1e83c33963ee29af45/index_final_github.html';
const NEW_WEB_APP='https://script.google.com/macros/s/AKfycbzJfCCIjsgNiTl_4ON8-1h7d8nspcazc9CCxkJoRRXJz8N8klzWQUTMBAdVKBUTsA/exec';
const frame=document.getElementById('catalog');
fetch(OLD).then(r=>r.text()).then(html=>{
  html=html.replace(/https:\/\/script\.google\.com\/macros\/s\/[^'"`\s]+/g,NEW_WEB_APP);
  frame.srcdoc=html;
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    const s=doc.createElement('style');s.id='lntdv-final-style';
    s.textContent=`
      :root{--bg:#f3eadc!important;--paper:#fffaf3!important;--ink:#33231b!important;--muted:#755f50!important;--line:#d8c5ae!important;--accent:#5a3b2b!important;--soft:#eee0ce!important}
      html,body{background:#f3eadc!important;color:#33231b!important}
      .site{max-width:1380px!important;padding:18px clamp(12px,3vw,34px) 80px!important}
      .hero{background:#fffaf3!important;border:1px solid #d8c5ae!important;box-shadow:0 12px 35px rgba(63,40,30,.10)!important}
      h1{color:#5a3b2b!important}.eyebrow{color:#755f50!important}.intro{color:#5f4b3d!important}
      .filter{background:#fffaf3!important;border-color:#cdb79e!important;color:#5a3b2b!important}.filter.active{background:#5a3b2b!important;color:#fffaf3!important}
      .photo-card{background:#fffaf3!important;border-color:#d8c5ae!important;box-shadow:0 6px 20px rgba(63,40,30,.07)!important}
      .photo-open,.photo-open img{background:#e8d7c1!important}
      .photo-open{aspect-ratio:4/5!important;min-height:0!important}.photo-open img{width:100%!important;height:100%!important;object-fit:contain!important}
      .photo-meta{background:#eee0ce!important;color:#33231b!important}.orientation-badge{color:#5a3b2b!important}
      .panel,.selected-list{background:#fffaf3!important;border-color:#d8c5ae!important}#drawer{background:#f8efe3!important}
      .close,.secondary{background:#eee0ce!important;color:#5a3b2b!important;border-color:#d0baa0!important}
      .primary,#order{background:#5a3b2b!important;color:#fffaf3!important}
      .photo-card.is-selected{border-color:#28a745!important;box-shadow:0 0 0 3px #28a745!important}
      .photo-card.is-selected .select-line::after{color:#28a745!important}.select-line::after{font-size:15px!important}
      .photo-card.selection-flash::after{background:rgba(40,167,69,.28)!important}
      .delivery-option:has(input:checked),.delivery-option.is-chosen{border-color:#5a3b2b!important;background:#eee0ce!important;box-shadow:0 0 0 2px #5a3b2b!important}
      #lightbox{background:rgba(47,29,20,.94)!important}
      .mail-popup-box{background:#fffaf3!important;border-color:#d8c5ae!important}.mail-popup-info{background:#eee0ce!important;border-color:#d8c5ae!important}
      .catalog-natura-title{margin:0 0 10px;color:#5a3b2b;font-size:clamp(1.1rem,2.4vw,1.5rem);letter-spacing:.08em;text-transform:uppercase}
      .catalog-natura-sub{margin:0 0 20px;color:#755f50;font-size:.95rem}
    `;
    doc.head.appendChild(s);
    const hero=doc.querySelector('.hero');
    if(hero && !doc.querySelector('.catalog-natura-title')){
      const block=doc.createElement('div');block.style.marginTop='14px';
      block.innerHTML='<div class="catalog-natura-title">Catalogo fotografico Arese 2026</div><p class="catalog-natura-sub">La Nostra Terra da Vicino · Edvinas Dragoni · 25 fotografie</p>';
      hero.appendChild(block);
    }
    document.getElementById('loading').style.display='none';
  });
}).catch(()=>{
  document.getElementById('loading').textContent='Il catalogo non è disponibile. Riprova tra qualche secondo.';
});
</script>
</body>
</html>
