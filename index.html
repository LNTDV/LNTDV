<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LNTDV — Sito in manutenzione</title>
<style>
:root{color-scheme:light;--brown:#4a2f22;--brown2:#6b4937;--beige:#f3eadf;--cream:#fbf7f1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--beige);color:var(--brown)}
body{display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(720px,100%);background:var(--cream);border:1px solid #d5c0ad;border-radius:24px;padding:48px 28px;text-align:center;box-shadow:0 18px 60px rgba(61,40,29,.12)}
.kicker{font-size:11px;letter-spacing:3px;font-weight:700;margin-bottom:18px}
h1{margin:0 0 18px;font-family:Georgia,serif;font-size:clamp(34px,8vw,64px);font-weight:400}
p{max-width:560px;margin:0 auto;line-height:1.7;color:var(--brown2)}
.line{width:72px;height:3px;background:var(--brown);margin:28px auto}
.status{display:inline-block;margin-top:24px;padding:10px 18px;border:1px solid #cdb8a5;border-radius:999px;background:#f7efe6;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
small{display:block;margin-top:30px;color:#8a7567}
/* Fascia marrone del titolo anche durante la manutenzione */
#exhibition-title{background:var(--brown);color:var(--cream);border-radius:18px;padding:28px 18px;margin:0 0 24px}
#exhibition-title h1{color:var(--cream);margin:0;font-family:Georgia,serif;font-weight:400}
</style>
</head>
<body>
<main><div id="exhibition-title"><h1>La Nostra Terra Da Vicino</h1></div>
<div class="kicker">EDVINAS DRAGONI · LNTDV</div>
<div class="line"></div>
<p>Il sito è temporaneamente in manutenzione. Stiamo completando le verifiche del catalogo fotografico e della visualizzazione delle immagini.</p>
<div class="status">Sito in manutenzione</div>
<small>Il sito tornerà online al termine delle verifiche.</small>
</main>
</body>
</html>
