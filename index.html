<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a3b2b">
<meta name="description" content="La Nostra Terra da Vicino — Catalogo fotografico Edvinas Dragoni, Arese 2026.">
<title>La Nostra Terra da Vicino — Edvinas Dragoni</title>
<style>
:root{--brown:#5a3b2b;--dark:#33231b;--beige:#f3eadc;--paper:#fffaf3;--line:#d8c5ae;--soft:#eee0ce}*{box-sizing:border-box}html,body{margin:0;background:var(--beige);color:var(--dark);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:1400px;margin:auto;padding:22px clamp(14px,3vw,42px) 70px}.top{display:flex;gap:18px;align-items:flex-start;padding:12px 0 24px;border-bottom:2px solid var(--brown)}.logo{width:62px;height:62px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--brown);font-weight:700;letter-spacing:.08em}.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#755f50}.title{margin:4px 0 5px;color:var(--brown);font-size:clamp(1.8rem,4vw,3.1rem);line-height:1.02}.subtitle{margin:0;color:#755f50}.intro{max-width:780px;line-height:1.55;margin:24px 0}.section{margin-top:42px}.section h2{margin:0;color:var(--brown);font-size:1.35rem;letter-spacing:.1em;text-transform:uppercase;border-left:5px solid var(--brown);padding-left:12px}.section p{margin:8px 0 18px;color:#755f50}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 7px 24px rgba(63,40,30,.08)}.photo{background:#e8d7c1;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.meta{padding:13px 14px 15px}.name{font-weight:700;color:var(--brown);line-height:1.25}.orientation{display:inline-block;margin-top:7px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#755f50;background:var(--soft);border-radius:999px;padding:5px 8px}.foot{margin-top:55px;padding-top:18px;border-top:2px solid var(--brown);font-size:.9rem;color:#755f50}.loading{min-height:55vh;display:grid;place-items:center;color:var(--brown);font-weight:700}.empty{padding:40px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
</style>
</head>
<body><div id="app" class="wrap"><div class="loading">Sto preparando il catalogo…</div></div>
<script>
const groups=[['Natura',10],['Tempo',3],['Natura vs Città',12]];
function orientation(img){return (img.naturalWidth||0)>(img.naturalHeight||0)?'Orizzontale':'Verticale'}
function build(images){const app=document.getElementById('app');app.innerHTML=`<header class="top"><div class="logo">ED</div><div><div class="eyebrow">La Nostra Terra da Vicino</div><h1 class="title">Catalogo fotografico</h1><p class="subtitle">Edvinas Dragoni · 25 fotografie · Arese 2026</p></div></header><p class="intro">Una selezione fotografica dedicata al rapporto tra paesaggio, tempo e trasformazione. Scopri le fotografie divise per tema.</p><main id="sections"></main><footer class="foot">Edvinas Dragoni · La Nostra Terra da Vicino · Arese 2026</footer>`;let pos=0;const sections=document.getElementById('sections');groups.forEach(([title,n])=>{const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<h2>${title}</h2><p>${n} fotografie</p><div class="grid"></div>`;const grid=sec.querySelector('.grid');images.slice(pos,pos+n).forEach((src,i)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="photo"><img src="${src}" alt="${title} — fotografia ${i+1}" loading="lazy"></div><div class="meta"><div class="name">${title} · ${String(i+1).padStart(2,'0')}</div><span class="orientation">Orientamento verticale</span></div>`;const img=card.querySelector('img');const badge=card.querySelector('.orientation');img.addEventListener('load',()=>badge.textContent='Orientamento '+orientation(img));grid.appendChild(card)});sections.appendChild(sec);pos+=n})}
// Il catalogo è autonomo: non richiama più index_final_github.html.
const images=[...Array(25)].map((_,i)=>`images/${String(i+1).padStart(2,'0')}.jpg`);build(images);
</script></body></html>
